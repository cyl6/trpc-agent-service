name: trpc-agent-service

services:
  # Keep one service process in the runnable baseline. Scaling requires a
  # durable inbox plus shared approval, budget and config-control stores.
  # Session, Memory and message coordination are already Redis-backed.
  service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: trpc-agent-service:local
    restart: unless-stopped
    init: true
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-development-admin-token}
      REDIS_URL: redis://redis:6379/0
      ACME_TELEGRAM_BOT_TOKEN: ${ACME_TELEGRAM_BOT_TOKEN:-unused-local-token}
      ACME_TELEGRAM_WEBHOOK_SECRET: ${ACME_TELEGRAM_WEBHOOK_SECRET:-local-development-webhook-secret}
      ACME_SLACK_BOT_TOKEN: ${ACME_SLACK_BOT_TOKEN:-unused-local-token}
      ACME_SLACK_SIGNING_SECRET: ${ACME_SLACK_SIGNING_SECRET:-local-development-signing-secret}
      ACME_WECOM_CORP_SECRET: ${ACME_WECOM_CORP_SECRET:-unused-local-token}
      ACME_WECOM_CALLBACK_TOKEN: ${ACME_WECOM_CALLBACK_TOKEN:-local-development-callback-token}
      ACME_WECOM_ENCODING_AES_KEY: ${ACME_WECOM_ENCODING_AES_KEY:-}
      GLOBEX_TELEGRAM_BOT_TOKEN: ${GLOBEX_TELEGRAM_BOT_TOKEN:-unused-local-token}
      GLOBEX_TELEGRAM_WEBHOOK_SECRET: ${GLOBEX_TELEGRAM_WEBHOOK_SECRET:-local-development-webhook-secret}
    ports:
      - "127.0.0.1:${SERVICE_PORT:-8080}:8080"
    volumes:
      - ./service-config.yaml:/etc/trpc-agent-service/config.yaml:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - frontend
      - backend

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "60"
      - "1000"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tenant_agent}
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-password}
      POSTGRES_INITDB_ARGS: --data-checksums
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../migrations/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15
    shm_size: 256mb
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ../observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${OTEL_HEALTH_PORT:-13133}:13133"
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ../observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      service:
        condition: service_healthy
      otel-collector:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

volumes:
  postgres-data:
  redis-data:
  prometheus-data:

networks:
  frontend:
  backend:
    internal: true
